<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Composer Web</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">PDF Composer</p>
        <h1>Combine PDFs and images</h1>
        <p class="intro">Upload files, arrange every page in one list, then download a PDF or an image archive.</p>
      </header>

      <section class="panel">
        <label class="token-field">Access token (if required)
          <input id="token" type="password" autocomplete="off" placeholder="WEB_AUTH_TOKEN">
        </label>
        <label class="dropzone" for="files">
          <strong>Choose PDFs or images</strong>
          <span>JPG, JPEG, PNG, and PDF files</span>
          <input id="files" type="file" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf" multiple>
        </label>
        <button id="upload" class="primary" type="button">Add Files</button>
        <p id="status" class="status" role="status"></p>
      </section>

      <section id="workspace" class="panel hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Ordered list</p>
            <h2 id="count">0 items</h2>
          </div>
          <p class="hint">Drag items to reorder. PDF pages are added individually.</p>
        </div>
        <ol id="items" class="items"></ol>
        <div class="actions">
          <button id="download-pdf" class="primary" type="button">Download PDF</button>
          <button id="download-images" class="secondary" type="button">Download images</button>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
